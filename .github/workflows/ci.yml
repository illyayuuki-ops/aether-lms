name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build API server
        run: pnpm --dir artifacts/api-server run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a database dump is committed
        run: |
          # Dumps contain real student PII; they must never live in the repo.
          if git ls-files | grep -Ei '\.(sql|dump|pgsql)$' | grep -v '^scripts/fixtures/'; then
            echo "::error::A database dump is tracked in git. Remove it and rotate any exposed credentials."
            exit 1
          fi
