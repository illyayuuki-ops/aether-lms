name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build API server
        run: pnpm --dir artifacts/api-server run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a database dump is committed
        run: |
          # Dumps contain real student PII; they must never live in the repo.
          # Drizzle migrations and seed fixtures are source, not dumps.
          if git ls-files | grep -Ei '\.(sql|dump|pgsql)$' \
               | grep -v '^scripts/fixtures/' \
               | grep -v '^lib/db/drizzle/'; then
            echo "::error::A database dump is tracked in git. Remove it and rotate any exposed credentials."
            exit 1
          fi

      - name: Fail if build output is committed
        run: |
          if git ls-files | grep -E '^(lib/[^/]+/dist|artifacts/[^/]+/dist)/'; then
            echo "::error::Build output is tracked. These directories are gitignored; run git rm -r --cached <dir>."
            exit 1
          fi

      - name: Fail if a migration is missing its SQL file
        run: |
          # Every entry in the Drizzle journal must have a matching .sql file.
          # A journal entry without SQL makes `db:migrate` fail at deploy time.
          missing=0
          for tag in $(grep -o '"tag": *"[^"]*"' lib/db/drizzle/meta/_journal.json | cut -d'"' -f4); do
            if [ ! -f "lib/db/drizzle/${tag}.sql" ]; then
              echo "::error::Migration '${tag}' is in the journal but lib/db/drizzle/${tag}.sql is missing."
              missing=1
            fi
          done
          exit $missing
