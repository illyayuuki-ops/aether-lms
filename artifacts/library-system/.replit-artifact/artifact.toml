kind = "web"
previewPath = "/"
title = "Library Computer Login System"
version = "1.0.0"
id = "artifacts/library-system"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25966

[services.development]
run = "pnpm --filter @workspace/library-system run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/library-system", "run", "build" ]
publicDir = "artifacts/library-system/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25966"
BASE_PATH = "/"
